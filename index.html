<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>GLOSSMATT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--gd:#F2B632;--bg:#0B0D10;--bg2:#12151A;--card:#171B21;--card2:#1D2229;--ink:#F3F5F7;--mut:#8E99A6;--line:#272D36;--ac:#F2B632;--acs:rgba(242,182,50,.13);--ok:#3DD598;--bad:#FF6B6B;--sh:0 14px 34px -16px rgba(0,0,0,.7);color-scheme:dark}
:root[data-theme="light"]{--bg:#F3F1EC;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F8F6F1;--ink:#16181C;--mut:#6B7480;--line:#E6E2D9;--ac:#9A6700;--acs:rgba(242,182,50,.2);--ok:#12805A;--bad:#C93A3A;--sh:0 14px 34px -18px rgba(70,45,0,.3);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 50% -8%,rgba(242,182,50,.12),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 Sora,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(94px + env(safe-area-inset-bottom,0))}
header{background:linear-gradient(135deg,#14161a,#2a2e34);padding:20px 18px 16px;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--gd);box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}
.hl{height:46px;display:block}
#sync{float:right;font-size:11px;color:#c9d2da;background:rgba(255,255,255,.08);padding:4px 10px;border-radius:20px}
main{padding:16px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px;font:600 11px Sora;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px;transition:.2s}
nav button.on{color:var(--ac);background:var(--acs)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
h2{font:600 22px 'Playfair Display',Georgia,serif;margin:4px 0 10px}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 8px;color:var(--ac)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);font:inherit;margin:3px 0 8px;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gd);box-shadow:0 0 0 3px var(--acs)}
label{font-size:12px;color:var(--mut)}
.btn{border:0;border-radius:14px;padding:12px 16px;font:600 14px Sora;background:linear-gradient(135deg,#FFD35A,#F0A81F);color:#1a1300;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
a.btn{text-decoration:none;text-align:center;display:inline-block}
.btn.g{background:var(--acs);color:var(--ac)}.btn.r{background:none;color:var(--bad);border:1px solid var(--bad)}
.sm{padding:8px 11px;font-size:12px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.emp{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.emp:last-child{border:0}
.emp .n{flex:1.3}.emp .n small{display:block;color:var(--mut);font-size:11px}
.seg{display:flex;gap:4px}.seg button{border:1px solid var(--line);background:var(--bg2);color:var(--mut);border-radius:10px;padding:9px 11px;font:600 13px Sora;cursor:pointer}
.seg .on{color:#08140e}.seg .P.on{background:var(--ok);border-color:var(--ok)}.seg .A.on{background:var(--bad);border-color:var(--bad)}.seg .O.on{background:var(--gd);border-color:var(--gd);color:#1a1300}
.bad{color:var(--bad)}.ok{color:var(--ok)}.mut{color:var(--mut);font-size:12px}
.job{cursor:pointer;transition:transform .15s}.job:active{transform:scale(.99)}.job .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.pill{display:inline-block;background:var(--acs);color:var(--ac);border-radius:20px;padding:3px 10px;font-size:11px;margin:2px 2px 0 0}
#ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none;padding:env(safe-area-inset-top,0) 14px 40px}
#ov .in{max-width:720px;margin:auto}
.sticky{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 30%);padding:14px 0 6px}
.chk{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.chk label{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:8px 13px;color:var(--ink);font-size:13px}
.chk input{width:auto;margin:0 6px 0 0}
.lgbox{background:linear-gradient(135deg,#14161a,#2a2e34);border-radius:18px;padding:16px;margin:0 0 14px}.lgbox img{width:100%;max-width:340px;display:block;margin:auto}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.ph div{position:relative}.ph img{width:96px;height:72px;object-fit:cover;border-radius:12px}
.ph button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;background:#000a;color:#fff;width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#14161a;color:#fff;border:1px solid var(--gd);padding:10px 16px;border-radius:14px;z-index:50;max-width:90vw;font-size:13px}
.hi{font:600 26px 'Playfair Display',Georgia,serif;line-height:1.2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{border-radius:20px;padding:14px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);box-shadow:var(--sh)}
.tile span{display:block;color:var(--mut);font-size:12px}.tile b{display:block;font:700 24px Sora;margin-top:4px}
.tile.gold{background:linear-gradient(135deg,#FFD35A,#F0A81F);border:0;color:#1a1300}.tile.gold span{color:#5a4200}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.bars i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#FFD35A,#F0A81F);min-height:3px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:20px;padding:8px 14px;font:600 13px Sora;cursor:pointer}
.chips .on{background:var(--gd);color:#1a1300;border-color:var(--gd)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,#FFD35A,#F0A81F);color:#1a1300;font:700 30px Sora;box-shadow:0 14px 28px -8px rgba(240,168,31,.6);z-index:7;cursor:pointer}
#pv{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:none;padding:env(safe-area-inset-top,0) 14px 40px}#pv .in{max-width:720px;margin:auto}
.pvc{width:100%;display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);margin:0 0 12px;background:#fff}
.paper{background:#fff;color:#111;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}.pband{background:#24262A;padding:10px 14px}.pband img{height:34px;display:block}.ptitle{font-weight:700;padding:10px 14px}
.paper .wide{overflow-x:auto}.paper table{border-collapse:collapse;font-size:11px;width:100%}.paper th{background:#24262A;color:#F5B82E;padding:6px 8px;text-align:left;white-space:nowrap}.paper td{padding:5px 8px;border-bottom:1px solid #e4e4e4;white-space:nowrap}
.lockbar{display:flex;align-items:center;gap:10px;background:var(--acs);border:1px dashed var(--gd);border-radius:14px;padding:10px 12px;margin:10px 0}.lockbar span{flex:1}
.seg .H.on{background:#5AA9FF;border-color:#5AA9FF}.seg button:disabled{opacity:.4}
#ovc input:not([type=number]):not([type=tel]):not([type=date]):not([type=time]):not([type=file]):not([type=checkbox]),#ovc textarea,#en,#sn{text-transform:uppercase}
</style></head><body>

 }catch(e){toast('Could not create Excel: '+(e.message||e))}}
 else{const d=new jspdf.jsPDF({orientation:orient==='l'?'landscape':'portrait',unit:'pt',format:'a4'});
